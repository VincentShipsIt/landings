name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

      - name: Install Redis for profile storage regression tests
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: MeterBar profile tests
        run: bun test
        working-directory: apps/meterbardev

      - run: bun run build
